services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: finedata-postgres
    environment:
      POSTGRES_DB: finedata
      POSTGRES_USER: finedata
      POSTGRES_PASSWORD: finedata_password
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finedata -d finedata"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finedata-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: finedata-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finedata-network

  # Backend API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: finedata-api
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - DEBUG=true
      - SECRET_KEY=finedata-secret-key-change-in-production
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=finedata
      - POSTGRES_PASSWORD=finedata_password
      - POSTGRES_DB=finedata
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_HOST=http://api:8000
      # Stripe (use test keys for development)
      - STRIPE_SECRET_KEY=sk_test_your_stripe_secret_key_here
      - STRIPE_WEBHOOK_SECRET=whsec_your_webhook_secret_here
      - STRIPE_PUBLISHABLE_KEY=pk_test_your_stripe_publishable_key_here
      # AWS S3 (optional for development)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - S3_BUCKET_DATASETS=finedata-dev-datasets
      - S3_BUCKET_SAMPLES=finedata-dev-samples
      # Hugging Face (optional for development)
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_ORG_NAME=${HF_ORG_NAME:-}
      # Email (optional for development)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      # SMTP (alternative to SendGrid)
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=587
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=finedata.ai
      - FROM_NAME=FineData
      # OpenAI (for ontology generation)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Moonshot AI (alternative LLM provider)
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      # FineWebData Integration
      - FINEDATA_SLURM_CONFIG_PATH=/home/ubuntu/datatrove/finewebdata/config.yaml
      - FINEDATA_SLURM_SETUP_SCRIPT=/home/ubuntu/datatrove/finewebdata/setup_slurm_cluster.sh
      - FINEDATA_HF_UPLOAD_SCRIPT=/home/ubuntu/datatrove/finewebdata/publish_to_hf.sh
      - FINEDATA_BENCHMARK_SAMPLE_SIZE=1000000
      - FINEDATA_PRODUCTION_TIMEOUT_HOURS=48
      # Hugging Face username (for dataset uploads)
      - HF_USERNAME=${HF_USERNAME:-}
      # Frontend API URL (for Next.js)
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - finedata-network
    restart: unless-stopped

  # Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: finedata-web
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=development
      - PORT=23000
    ports:
    - "23000:23000"
    depends_on:
    - api
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/package.json:/app/package.json
      - ./web/package-lock.json:/app/package-lock.json
      - ./web/next.config.ts:/app/next.config.ts
      - ./web/tsconfig.json:/app/tsconfig.json
      - ./web/postcss.config.mjs:/app/postcss.config.mjs
      - ./web/eslint.config.mjs:/app/eslint.config.mjs
      - ./web/tailwind.config.ts:/app/tailwind.config.ts
      - web-node_modules:/app/node_modules
      - web-next:/app/.next
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:23000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - finedata-network
    restart: unless-stopped

  # Celery worker for async tasks
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: finedata-worker
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "--queues=benchmark,production,email"]
    environment:
      - DEBUG=true
      - SECRET_KEY=finedata-secret-key-change-in-production
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=finedata
      - POSTGRES_PASSWORD=finedata_password
      - POSTGRES_DB=finedata
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_HOST=http://api:8000
      # Stripe (use test keys for development)
      - STRIPE_SECRET_KEY=sk_test_your_stripe_secret_key_here
      - STRIPE_WEBHOOK_SECRET=whsec_your_webhook_secret_here
      - STRIPE_PUBLISHABLE_KEY=pk_test_your_stripe_publishable_key_here
      # AWS S3 (optional for development)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - S3_BUCKET_DATASETS=finedata-dev-datasets
      - S3_BUCKET_SAMPLES=finedata-dev-samples
      # Hugging Face (optional for development)
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_USERNAME=${HF_USERNAME:-}
      - HF_ORG_NAME=${HF_ORG_NAME:-}
      # Email (optional for development)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      # SMTP (alternative to SendGrid)
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=587
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=finedata.ai
      - FROM_NAME=FineData
      # OpenAI (for ontology generation)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Moonshot AI (alternative LLM provider)
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      # FineWebData Integration
      - FINEDATA_SLURM_CONFIG_PATH=/home/ubuntu/datatrove/finewebdata/config.yaml
      - FINEDATA_SLURM_SETUP_SCRIPT=/home/ubuntu/datatrove/finewebdata/setup_slurm_cluster.sh
      - FINEDATA_HF_UPLOAD_SCRIPT=/home/ubuntu/datatrove/finewebdata/publish_to_hf.sh
      - FINEDATA_BENCHMARK_SAMPLE_SIZE=1000000
      - FINEDATA_PRODUCTION_TIMEOUT_HOURS=48
      # Frontend API URL (for Next.js)
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
    networks:
      - finedata-network
    restart: unless-stopped

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: finedata-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
      - api
    networks:
      - finedata-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  web-node_modules:
  web-next:

networks:
  finedata-network:
    driver: bridge
