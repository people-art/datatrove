# Development overrides for docker-compose.yml
# This file is automatically loaded when running docker-compose

version: '3.8'

services:
  # Override API service for development
  api:
    environment:
      - DEBUG=true
    volumes:
      - ./api:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"

  # Override web service for development
  web:
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./web:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"

  # Disable nginx for development
  nginx:
    profiles:
      - disabled
